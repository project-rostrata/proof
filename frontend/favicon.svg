<!-- A contact sheet (a proof sheet): a plate of four frames, with the top right one filled in as
     the pick. One flat silhouette in the house accent, like the sibling apps' favicons, with the
     colour hardcoded because a favicon can't reach CSS custom properties. The media query swaps
     to the lighter dark mode accent (style.css's accent on surface) so it stays visible on a
     dark tab bar. favicon.ico and apple-touch-icon.png are PNG renders of this same path for
     browsers that don't use SVG icons; keep all three in sync by hand.
     NOTE: never put a double hyphen in this comment. XML forbids it inside comments, and the
     browser then silently drops the whole icon (this happened once here, and once in larder). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>path { fill: #5E7A32; } @media (prefers-color-scheme: dark) { path { fill: #93B558; } }</style>
  <path fill-rule="evenodd" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm1.5 3v5h4.5V6Zm0 7v5h4.5v-5Zm6.5 0v5h4.5v-5Z"/>
</svg>
