<!-- A 2x2 contact sheet: four frames, one marked as the pick in the house olive accent, in its
     on-dark tone (--accent-on-surface, #93B558) so it reads on the dark tile at 16 px. The colours
     are hard-coded because a favicon can't reach CSS custom properties. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <rect x="2" y="2" width="20" height="20" rx="3" fill="#1A1A1A"/>
  <rect x="4.5" y="4.5" width="6.5" height="6.5" rx="1" fill="#9E9E9E"/>
  <rect x="13" y="4.5" width="6.5" height="6.5" rx="1" fill="#93B558"/>
  <rect x="4.5" y="13" width="6.5" height="6.5" rx="1" fill="#9E9E9E"/>
  <rect x="13" y="13" width="6.5" height="6.5" rx="1" fill="#9E9E9E"/>
</svg>
